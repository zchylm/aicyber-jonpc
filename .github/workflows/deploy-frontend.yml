name: Deploy Jon PC frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://jonpc-backend.prouddesert-f3cf5e65.australiaeast.azurecontainerapps.io
          VITE_JONPC_INTERNAL_DEMO: "false"
          VITE_JONPC_BANK_TRANSFER: "true"
          VITE_JONPC_STRIPE: "true"
          VITE_JONPC_STRIPE_TEST_MODE: "false"
        run: npm run build

      - name: Validate public SEO assets
        working-directory: frontend
        run: npm run check:seo

      - name: Install storefront test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Check existing storefront interactions
        working-directory: frontend
        env:
          JONPC_TEST_BASE_URL: http://127.0.0.1:5174
        run: npm run test:storefront

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
