spring.application.name=jon-pc-backend
server.port=${PORT:8080}
spring.datasource.url=${JON_PC_DB_URL:jdbc:postgresql://localhost:5432/jonpc}
spring.datasource.username=${JON_PC_DB_USERNAME:postgres}
spring.datasource.password=${JON_PC_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${JON_PC_DB_POOL_SIZE:5}
# Keep database timestamp reads aligned with the Melbourne business timezone.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Australia/Melbourne'
spring.flyway.locations=classpath:db/migration
jonpc.auth.jwt-secret=${JON_PC_JWT_SECRET:local-development-secret-change-before-deploying-please-use-a-long-random-value}
jonpc.auth.jwt-expiration-hours=${JON_PC_JWT_EXPIRATION_HOURS:24}
jonpc.auth.email-verification-enabled=${JON_PC_EMAIL_VERIFICATION_ENABLED:false}
jonpc.auth.email-verification-url=${JON_PC_EMAIL_VERIFICATION_URL:http://localhost:5173/}
jonpc.auth.email-verification-token-hours=${JON_PC_EMAIL_VERIFICATION_TOKEN_HOURS:24}
jonpc.auth.password-reset-enabled=${JON_PC_PASSWORD_RESET_ENABLED:false}
jonpc.auth.password-reset-url=${JON_PC_PASSWORD_RESET_URL:http://localhost:5173/}
jonpc.auth.password-reset-token-minutes=${JON_PC_PASSWORD_RESET_TOKEN_MINUTES:60}
jonpc.email.provider=${JON_PC_EMAIL_PROVIDER:disabled}
jonpc.email.dispatch-enabled=${JON_PC_EMAIL_DISPATCH_ENABLED:false}
jonpc.email.dispatch-interval-ms=${JON_PC_EMAIL_DISPATCH_INTERVAL_MS:5000}
jonpc.email.from=${JON_PC_EMAIL_FROM:JON. PC <hello@jonpc.com.au>}
jonpc.email.reply-to=${JON_PC_EMAIL_REPLY_TO:jambo@aicybermedia.com.au}
jonpc.email.account-url=${JON_PC_EMAIL_ACCOUNT_URL:http://localhost:5173/}
jonpc.email.operations-recipient=${JON_PC_EMAIL_OPERATIONS_RECIPIENT:}
jonpc.email.resend.api-key=${JON_PC_RESEND_API_KEY:}
jonpc.email.resend.base-url=${JON_PC_RESEND_BASE_URL:https://api.resend.com}
jonpc.email.resend.webhook-secret=${JON_PC_RESEND_WEBHOOK_SECRET:}
jonpc.ai.provider=${JON_PC_LLM_PROVIDER:claude}
jonpc.ai.claude.api-key=${ANTHROPIC_API_KEY:}
jonpc.ai.claude.model=${JON_PC_CLAUDE_MODEL:claude-sonnet-5}
jonpc.ai.claude.base-url=${JON_PC_CLAUDE_BASE_URL:https://api.anthropic.com}
jonpc.rewards.demo-enabled=${JON_PC_REWARDS_DEMO_ENABLED:false}
jonpc.payments.demo-enabled=${JON_PC_PAYMENTS_DEMO_ENABLED:false}
jonpc.invoice.seller-legal-name=${JON_PC_INVOICE_LEGAL_NAME:AI CYBER AUSTRALIA PTY LTD}
jonpc.invoice.seller-trading-name=${JON_PC_INVOICE_TRADING_NAME:JON. PC}
jonpc.invoice.seller-abn=${JON_PC_INVOICE_ABN:22 689 546 450}
jonpc.invoice.seller-address=${JON_PC_INVOICE_ADDRESS:205 Kensington Rd, West Melbourne VIC 3003, Australia}
jonpc.invoice.seller-email=${JON_PC_INVOICE_EMAIL:sales@aicybermedia.com.au}
jonpc.invoice.seller-phone=${JON_PC_INVOICE_PHONE:+61 436 365 016}
jonpc.invoice.email-delivery-enabled=${JON_PC_INVOICE_EMAIL_DELIVERY_ENABLED:false}
