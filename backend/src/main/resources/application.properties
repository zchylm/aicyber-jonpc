spring.application.name=jon-pc-backend
server.port=${PORT:8080}
spring.datasource.url=${JON_PC_DB_URL:jdbc:postgresql://localhost:5432/jonpc}
spring.datasource.username=${JON_PC_DB_USERNAME:postgres}
spring.datasource.password=${JON_PC_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${JON_PC_DB_POOL_SIZE:5}
# Keep database timestamp reads aligned with the Melbourne business timezone.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Australia/Melbourne'
spring.flyway.locations=classpath:db/migration
jonpc.auth.jwt-secret=${JON_PC_JWT_SECRET:local-development-secret-change-before-deploying-please-use-a-long-random-value}
jonpc.auth.jwt-expiration-hours=${JON_PC_JWT_EXPIRATION_HOURS:24}
jonpc.ai.provider=${JON_PC_LLM_PROVIDER:demo}
jonpc.ai.gemini.api-key=${JON_PC_GEMINI_API_KEY:}
jonpc.ai.gemini.model=${JON_PC_GEMINI_MODEL:gemini-3.7-flash}
