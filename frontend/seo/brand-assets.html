<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>JON.PC brand asset source</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #050708; font-family: Manrope, Arial, sans-serif; }
      .share-card { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 52px 64px; color: #f4f7f5; background: radial-gradient(ellipse at 95% 80%, #123532, transparent 60%), #050708; border-top: 5px solid #c3ef80; }
      .share-card::before { position: absolute; inset: 0; content: ''; background-image: linear-gradient(#8fe8e20a 1px, transparent 1px), linear-gradient(90deg, #8fe8e20a 1px, transparent 1px); background-size: 64px 64px; }
      .share-card > * { position: relative; }
      .brand { width: 270px; filter: invert(1); mix-blend-mode: screen; }
      h1 { margin: 27px 0 20px; font-size: 73px; font-weight: 600; line-height: 1.08; letter-spacing: -.055em; }
      h1 span { color: #8fe8e2; }
      .location { margin: 0; color: #d3e7e3; font-size: 23px; }
      .base { position: absolute; right: 64px; bottom: 43px; left: 64px; display: flex; align-items: center; justify-content: space-between; padding-top: 22px; border-top: 1px solid #8fe8e239; font-size: 19px; }
      .base span:last-child { color: #c3ef80; }
      .favicon { position: relative; width: 96px; height: 96px; overflow: hidden; background: #050708; }
      .favicon img { position: absolute; width: 240px; max-width: none; left: 16px; top: -4px; clip-path: inset(0 180px 0 0); filter: invert(1); mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <section class="share-card" aria-label="JON.PC social sharing image">
      <img class="brand" src="/brand/jonpc-logo.png" alt="JON.PC AI Technology" />
      <h1>Gaming PCs. Mini PCs.<br /><span>Custom builds.</span></h1>
      <p class="location">West Melbourne, Australia.</p>
      <div class="base"><span>Purpose-built computers, clearly configured.</span><span>jonpc.com.au ↗</span></div>
    </section>
    <div class="favicon" aria-label="JON.PC portrait favicon"><img src="/brand/jonpc-logo.png" alt="" /></div>
  </body>
</html>
